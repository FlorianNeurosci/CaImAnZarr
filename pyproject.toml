[project]
name = "caiman"
description = "Library and software for ROI detection and deconvolution of Calcium Imaging datasets"
authors = [
	{ name = "Andrea Giovannucci"},
	{ name = "Eftychios Pnevmatikakis"},
	{ name = "Johannes Friedrich" },
	{ name = "Valentina Staneva" },
	{ name = "Ben Deverett" },
	{ name = "Erick Cobos" },
	{ name = "Jeremie Kalfon"},
  { name = "Kushal Kolar"}, 
  { name = "Manuel Paez"}]
readme = "README.md"
dynamic = ["classifiers", "keywords", "license", "scripts", "version"]
dependencies = [
  "av",
  "certifi",
  "h5py >= 3.4.0",
  "ipyparallel",
  "ipython",
  "ipywidgets",
  "matplotlib",
  "numpy",
  "opencv-python",
  "peakutils >= 1.3.5",
  "pims",
  "psutil",
  "scikit-image >= 0.19.0, != 0.26.0",
  "scikit-learn >= 1.2",
  "scipy >= 1.10.1",
  "setuptools",
  "tifffile",
  "tqdm",
  "zarr >= 3"
]

# CaImAnZarr: the default install covers `import caiman`, motion correction and CNMF / CNMF-E.
# The heavy packages upstream installs by default are extras; `caiman[all]` gives upstream's full set.
[project.optional-dependencies]
dl = [            # CNN component classifiers, VolPy, OnACID ring-CNN background
  "keras",
  "torch",
  "torchvision"
]
viz = [           # interactive plots, movie playback and export
  "bokeh >= 3.1.1",
  "holoviews >= 1.16.2",
  "moviepy",
  "panel >= 1.0.2",
  "pyside6"
]
nwb = [
  "pynwb"
]
dev = [
  "coverage",
  "cython",
  "mypy",
  "numpydoc",
  "pytest",
  "pytest-cov",
  "yapf"
]
jupyter = [
  "ipykernel",
  "jupyter",
  "jupyter_bokeh",
  "pyqtgraph",
  "tk"
]
all = ["caiman[dl,viz,nwb,dev,jupyter]"]

[build-system]
requires = ["cython", "numpy", "setuptools", "wheel"]

[tool.setuptools]
py-modules = ["_buildhelper_cython"]

[tool.setuptools.cmdclass]
build_py = "_buildhelper_cython.build_py"

[tool.codespell]
skip = '.git,*.pdf,*.svg,*.ai'
check-hidden = true
ignore-regex = '^\s*"image/\S+": ".*'
# some ad-hoc options/variable names
ignore-words-list = 'ans,siz,nd,dirct,dircts,fo,comparitor,shfts,mapp,coo,ptd,manuel,thre,recuse'
